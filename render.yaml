services:
  - type: web
    name: ai-readiness
    runtime: node
    plan: free
    # Instala deps do backend, do client, e builda o front React (gera client/dist)
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
